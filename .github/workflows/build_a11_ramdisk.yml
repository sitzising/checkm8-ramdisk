name: Build A11 16.7.8 Ramdisks Only

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release 标签 (例如: v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-mac-ramdisks:
    runs-on: macos-13
    strategy:
      fail-fast: false
      matrix:
        dev: [
          "iPhone10,1", # iPhone 8 GSM
          "iPhone10,2", # iPhone 8 Plus GSM
          "iPhone10,3", # iPhone X Global
          "iPhone10,4", # iPhone 8 Global
          "iPhone10,5", # iPhone 8 Plus Global
          "iPhone10,6"  # iPhone X GSM
        ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          brew install libimobiledevice img4tool zip unzip
          git clone https://github.com/verygenericname/SSHRD_Script --recursive

      - name: Build 16.7.8 Ramdisk
        run: |
          cd SSHRD_Script
          mkdir -p ../output
          ./sshrd.sh clean || true
          ./sshrd.sh 16.7.8 "${{ matrix.dev }}"

          if [ -d "boot" ]; then
            cd boot
            zip -r "../../output/${{ matrix.dev }}_16.7.8.zip" .
            echo "[SUCCESS] Successfully built ${{ matrix.dev }}_16.7.8.zip"
          else
            echo "[ERROR] Failed to build ${{ matrix.dev }}" && exit 1
          fi

      - name: Save Zip File
        uses: actions/upload-artifact@v4
        with:
          name: ramdisk-${{ matrix.dev }}-16.7.8
          path: output/*.zip
