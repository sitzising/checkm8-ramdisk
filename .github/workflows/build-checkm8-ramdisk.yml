# checkm8 SSH Ramdisk（A7–A11）— SSHRD_Script_Lite，不依赖 gaster
#
# 覆盖节点：11.4.1 → 12.5.7 → 13.7 → 14.0 → 15.0 → 16.0 →（可选）16.7.8
#
# 用法：Actions → Build Checkm8 Ramdisks → Run workflow
#   scope=smoke  先验证 1 条（iPhone10,6 @ 15.0）
#   scope=a11    8/8+/X 全标识 × 节点（推荐）
#   scope=all    A7–A11 全机型 × 节点
#   publish_release=true → 自动打 GitHub Release（公开直链，单个 zip，不上传 5GB bundle）
name: Build Checkm8 Ramdisks

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "smoke=试跑 / a11=仅 A11 / all=A7–A11 / retry=重跑 _retry_fails.txt"
        type: choice
        options: [smoke, a11, all, retry]
        default: a11
      include_apfs:
        description: "包含 16.7.8（iPhone X 最高区间；Linux 通常跳过，除非 force_apfs）"
        type: boolean
        default: true
      force_apfs:
        description: "强制尝试 APFS(16.1+) 构建（Linux 多半失败）"
        type: boolean
        default: false
      only_product:
        description: "仅这些机型（空格分隔），如 iPhone10,6 iPhone10,2"
        type: string
        default: ""
      only_ios:
        description: "仅这些节点（空格分隔），如 15.0 16.0 16.7.8"
        type: string
        default: ""
      max_parallel:
        description: "并行构建数（IPSW 较大，建议 2–4）"
        type: string
        default: "3"
      publish_release:
        description: "构建完成后自动发布到 GitHub Release（公开直链）"
        type: boolean
        default: true
      release_tag:
        description: "Release tag（空=自动 ramdisk-YYYYMMDD-HHMM）"
        type: string
        default: ""
      make_latest:
        description: "把本次 Release 标为 latest"
        type: boolean
        default: true

concurrency:
  group: checkm8-ramdisk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  plan:
    name: Plan matrix
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      count: ${{ steps.gen.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate matrix
        id: gen
        env:
          SCOPE: ${{ inputs.scope }}
          ONLY_PRODUCT: ${{ inputs.only_product }}
          ONLY_IOS: ${{ inputs.only_ios }}
          INCLUDE_APFS: ${{ inputs.include_apfs }}
        run: |
          python3 Scripts/baota/gha-plan-matrix.py --out matrix.json
          echo "Planned jobs: $(python3 -c 'import json;print(len(json.load(open("matrix.json"))["include"]))')"
          cat matrix.json | head -c 2000 || true

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: build-matrix
          path: matrix.json

  build:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || '3') }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Build ramdisk
        id: build
        env:
          PRODUCT: ${{ matrix.product }}
          IOS: ${{ matrix.ios }}
          OUT_IOS: ${{ matrix.out }}
          BUILDID: ${{ matrix.buildid }}
          FORCE_APFS: ${{ inputs.force_apfs && '1' || '0' }}
          SKIP_DEPS: "0"
          PRECHECK_IPSW: "1"
        run: |
          chmod +x Scripts/baota/*.sh
          bash Scripts/baota/gha-build-one.sh "$PRODUCT" "$IOS" "$OUT_IOS" "$BUILDID"

      - name: Upload zip
        if: success() && hashFiles('ramdisk-artifact/*.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ramdisk-${{ matrix.name }}
          path: ramdisk-artifact/*.zip
          if-no-files-found: warn
          retention-days: 14

  pack:
    name: Pack + Publish Release
    needs: [plan, build]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all ramdisk artifacts
        uses: actions/download-artifact@v4
        with:
          path: collected
          pattern: ramdisk-*
          merge-multiple: true

      - name: Bundle artifact (optional local mirror)
        run: |
          mkdir -p dist
          shopt -s nullglob
          zips=(collected/*.zip collected/**/*.zip)
          count=0
          for z in "${zips[@]}"; do
            [[ -f "$z" ]] || continue
            cp -f "$z" dist/
            count=$((count + 1))
          done
          echo "Collected $count zip(s)"
          ls -lah dist/ || true
          if [[ "$count" -eq 0 ]]; then
            echo "No zips produced (all skipped or failed)"
            echo "has_zips=0" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "has_zips=1" >> "$GITHUB_ENV"
          (
            cd dist
            sha256sum *.zip > SHA256SUMS.txt
            # 注意：整包常 >2GB，不能上 GitHub Release；仅保留为 Actions artifact
            zip -q -r ../checkm8-ramdisks-bundle.zip . || true
          )
          ls -lah checkm8-ramdisks-bundle.zip 2>/dev/null || true

      - name: Upload bundle artifact
        if: env.has_zips == '1' && hashFiles('checkm8-ramdisks-bundle.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: checkm8-ramdisks-bundle
          path: |
            checkm8-ramdisks-bundle.zip
            dist/SHA256SUMS.txt
          retention-days: 30

      - name: Prepare Release assets
        if: env.has_zips == '1' && inputs.publish_release
        id: prep
        run: |
          TAG="${{ inputs.release_tag }}"
          if [[ -z "$TAG" ]]; then
            TAG="ramdisk-$(date -u +%Y%m%d-%H%M)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # 合并已有 tag 上的 manifest，避免 fill 发布冲掉既有机型索引
          MERGE_ARGS=()
          mkdir -p /tmp/prev-rel
          if gh release download "$TAG" -R "${{ github.repository }}" \
                -p manifest.json -D /tmp/prev-rel --clobber; then
            MERGE_ARGS=(--merge-manifest /tmp/prev-rel/manifest.json)
            echo "[merge] loaded previous manifest from $TAG"
          else
            echo "[merge] WARN no previous manifest on $TAG"
          fi
          python3 Scripts/baota/gha-make-release-assets.py \
            --in collected \
            --out release-assets \
            --repo "${{ github.repository }}" \
            --tag "$TAG" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${MERGE_ARGS[@]}"
          ls -lah release-assets | head -n 50
          echo "count=$(find release-assets -maxdepth 1 -name '*.zip' | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: env.has_zips == '1' && inputs.publish_release && steps.prep.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prep.outputs.tag }}
          MAKE_LATEST: ${{ inputs.make_latest }}
        run: |
          set -euo pipefail
          NOTES=release-assets/RELEASE_NOTES.md
          # 单个 zip ≤2GB；不上传 bundle
          mapfile -t FILES < <(find release-assets -maxdepth 1 -type f ! -name 'RELEASE_NOTES.md' | sort)
          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "No assets to publish"
            exit 0
          fi
          LATEST_FLAG=()
          if [[ "$MAKE_LATEST" == "true" ]]; then
            LATEST_FLAG=(--latest)
          else
            LATEST_FLAG=(--latest=false)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release $TAG"
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --notes-file "$NOTES" "${LATEST_FLAG[@]}"
          else
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --title "Checkm8 Ramdisks $TAG" \
              --notes-file "$NOTES" \
              "${LATEST_FLAG[@]}" \
              "${FILES[@]}"
          fi
          # 最终以 Release 上全部 zip 重建索引（防止 merge 失败缩索引）
          python3 Scripts/baota/gha-rebuild-release-index.py --repo "${{ github.repository }}" --tag "$TAG"
          echo "Release URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
          echo "Latest manifest: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/manifest.json"
