name: Build All Linux-Compatible checkm8 Ramdisks

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release 标签 (例如: v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-ramdisks:
    runs-on: ubuntu-latest # 100% 免费 Linux 环境
    strategy:
      fail-fast: false
      max-parallel: 4 # 降低并发，防止请求过于频繁
      matrix:
        include:
          # ==================== A11 设备 (iPhone 8 / 8 Plus / X) ====================
          - { dev: "iPhone10,1", ver: "13.7" }
          - { dev: "iPhone10,1", ver: "14.0" }
          - { dev: "iPhone10,1", ver: "15.0" }
          - { dev: "iPhone10,1", ver: "16.0" }

          - { dev: "iPhone10,2", ver: "13.7" }
          - { dev: "iPhone10,2", ver: "14.0" }
          - { dev: "iPhone10,2", ver: "15.0" }
          - { dev: "iPhone10,2", ver: "16.0" }

          - { dev: "iPhone10,3", ver: "13.7" }
          - { dev: "iPhone10,3", ver: "14.0" }
          - { dev: "iPhone10,3", ver: "15.0" }
          - { dev: "iPhone10,3", ver: "16.0" }

          - { dev: "iPhone10,4", ver: "13.7" }
          - { dev: "iPhone10,4", ver: "14.0" }
          - { dev: "iPhone10,4", ver: "15.0" }
          - { dev: "iPhone10,4", ver: "16.0" }

          - { dev: "iPhone10,5", ver: "13.7" }
          - { dev: "iPhone10,5", ver: "14.0" }
          - { dev: "iPhone10,5", ver: "15.0" }
          - { dev: "iPhone10,5", ver: "16.0" }

          - { dev: "iPhone10,6", ver: "13.7" }
          - { dev: "iPhone10,6", ver: "14.0" }
          - { dev: "iPhone10,6", ver: "15.0" }
          - { dev: "iPhone10,6", ver: "16.0" }

          # ==================== A10 设备 (iPhone 7 / 7 Plus) ====================
          - { dev: "iPhone9,1", ver: "10.3.3" }
          - { dev: "iPhone9,1", ver: "13.7" }
          - { dev: "iPhone9,1", ver: "14.0" }
          - { dev: "iPhone9,1", ver: "15.8" }

          - { dev: "iPhone9,2", ver: "10.3.3" }
          - { dev: "iPhone9,2", ver: "13.7" }
          - { dev: "iPhone9,2", ver: "14.0" }
          - { dev: "iPhone9,2", ver: "15.8" }

          - { dev: "iPhone9,3", ver: "10.3.3" }
          - { dev: "iPhone9,3", ver: "13.7" }
          - { dev: "iPhone9,3", ver: "14.0" }
          - { dev: "iPhone9,3", ver: "15.8" }

          - { dev: "iPhone9,4", ver: "10.3.3" }
          - { dev: "iPhone9,4", ver: "13.7" }
          - { dev: "iPhone9,4", ver: "14.0" }
          - { dev: "iPhone9,4", ver: "15.8" }

          # ==================== A9 设备 (iPhone 6s / 6s Plus / SE 1) ====================
          - { dev: "iPhone8,1", ver: "13.7" }
          - { dev: "iPhone8,1", ver: "14.0" }
          - { dev: "iPhone8,1", ver: "15.8" }

          - { dev: "iPhone8,2", ver: "13.7" }
          - { dev: "iPhone8,2", ver: "14.0" }
          - { dev: "iPhone8,2", ver: "15.8" }

          - { dev: "iPhone8,4", ver: "13.7" }
          - { dev: "iPhone8,4", ver: "14.0" }
          - { dev: "iPhone8,4", ver: "15.8" }

          # ==================== A8 设备 (iPhone 6 / 6 Plus) ====================
          - { dev: "iPhone7,1", ver: "12.5.7" }
          - { dev: "iPhone7,2", ver: "12.5.7" }

          # ==================== A7 设备 (iPhone 5s) ====================
          - { dev: "iPhone6,1", ver: "12.5.7" }
          - { dev: "iPhone6,2", ver: "12.5.7" }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            wget \
            zip \
            unzip \
            libimobiledevice-utils \
            libplist-utils \
            libzip-dev \
            libssl-dev \
            libusb-1.0-0-dev \
            aria2

          # 克隆 SSHRD 主脚本
          git clone https://github.com/verygenericname/SSHRD_Script --recursive

      - name: Build Ramdisk Package
        run: |
          cd SSHRD_Script
          mkdir -p ../output
          
          # 清理缓存
          ./sshrd.sh clean || true

          # 增加重试机制避免偶发性网络坏包
          MAX_RETRIES=3
          COUNT=0
          SUCCESS=false

          while [ $COUNT -lt $MAX_RETRIES ]; do
            echo "[INFO] Building Ramdisk for ${{ matrix.dev }} (${{ matrix.ver }})... Attempt $((COUNT+1))"
            if ./sshrd.sh "${{ matrix.ver }}" "${{ matrix.dev }}"; then
              if [ -d "boot" ]; then
                SUCCESS=true
                break
              fi
            fi
            echo "[WARNING] Build failed, cleaning and retrying..."
            ./sshrd.sh clean || true
            COUNT=$((COUNT+1))
            sleep 3
          done

          if [ "$SUCCESS" = true ]; then
            cd boot
            zip -r "../../output/${{ matrix.dev }}_${{ matrix.ver }}.zip" .
            echo "[SUCCESS] Successfully built ${{ matrix.dev }}_${{ matrix.ver }}.zip"
          else
            echo "[ERROR] Failed to build ${{ matrix.dev }} for ${{ matrix.ver }} after $MAX_RETRIES attempts"
            exit 1
          fi

      - name: Save Ramdisk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ramdisk-${{ matrix.dev }}-${{ matrix.ver }}
          path: output/*.zip
